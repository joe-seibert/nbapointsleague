name: Update Points League Data

on:
  schedule:
    - cron: "0 7 * * *"

  push:
    branches:
      - main

  workflow_dispatch:

env:
  SEASON: "2026"

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Execute Python script
        env:
          WEBSHARE_API_KEY: ${{ secrets.WEBSHARE_API_KEY }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 60
          # Webshare's free-tier proxy IPs get reassigned periodically, so a
          # static proxy URL goes stale and returns 407. Fetch the current
          # list from the API on every attempt and pick a random valid one.
          command: |
            set -euo pipefail
            PROXY_JSON=$(curl -sfS \
              -H "Authorization: Token $WEBSHARE_API_KEY" \
              "https://proxy.webshare.io/api/v2/proxy/list/?mode=direct&page_size=25")
            mapfile -t PROXIES < <(echo "$PROXY_JSON" | jq -r '
              .results[]
              | select(.valid == true)
              | "http://\(.username):\(.password)@\(.proxy_address):\(.port)"
            ')
            if [ ${#PROXIES[@]} -eq 0 ]; then
              echo "No valid proxies returned by Webshare API"
              exit 1
            fi
            export WEBSHARE_PROXY="${PROXIES[$RANDOM % ${#PROXIES[@]}]}"
            echo "Picked 1 of ${#PROXIES[@]} valid proxies from Webshare"
            uv run points_league.py

      - name: Push data to data branch
        run: |
          git config --local user.name "joe-seibert"
          git config --local user.email "joe-seibert@users.noreply.github.com"
          cp seasons/$SEASON/data/pointsleague_$SEASON.json /tmp/
          cp seasons/$SEASON/data/full_points_table_$SEASON.json /tmp/
          cp seasons/$SEASON/data/all_players_$SEASON.json /tmp/
          cp seasons/$SEASON/data/player_games_$SEASON.json /tmp/
          git fetch origin data:refs/remotes/origin/data || true
          git checkout -B data origin/data 2>/dev/null || git checkout --orphan data
          git rm -rf . --quiet
          cp /tmp/pointsleague_$SEASON.json .
          cp /tmp/full_points_table_$SEASON.json .
          cp /tmp/all_players_$SEASON.json .
          cp /tmp/player_games_$SEASON.json .
          git add pointsleague_$SEASON.json full_points_table_$SEASON.json all_players_$SEASON.json player_games_$SEASON.json
          git diff --cached --quiet || git commit -m "Update data $(date)"
          git push -f origin data
